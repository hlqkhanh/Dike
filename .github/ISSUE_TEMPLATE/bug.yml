name: Bug report
description: Report reproducible incorrect behavior without sensitive data.
title: 'bug: '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: Do not include credentials, identity documents, phone numbers, or precise user locations.
  - type: textarea
    id: outcome
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web, API, Worker, Mobile, Infrastructure, Documentation]
    validations:
      required: true
