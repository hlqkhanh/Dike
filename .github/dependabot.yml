version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    groups:
      safe-minor-and-patch:
        update-types: [minor, patch]
    labels: ['type:security', 'area:infra']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:30'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    labels: ['type:security', 'area:infra']
