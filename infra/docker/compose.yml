name: dike-local

services:
  mongo:
    image: mongo:8.0.14
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - dike-mongo:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'try { rs.status().ok } catch (error) { quit(1) }']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0.14
    depends_on:
      mongo:
        condition: service_started
    entrypoint:
      - bash
      - -ec
      - |
        until mongosh 'mongodb://mongo:27017/?directConnection=true' --quiet --eval "db.adminCommand('ping').ok"; do sleep 1; done
        mongosh 'mongodb://mongo:27017/?directConnection=true' --quiet --eval "try { rs.status() } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
        until mongosh 'mongodb://mongo:27017/?directConnection=true' --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)"; do sleep 1; done
    restart: 'no'

  redis:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - dike-redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_BASE_URL:-http://localhost:3000}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET_PUBLIC:-dike-local-public}:download,${S3_BUCKET_PRIVATE:-dike-local-private}:none
    volumes:
      - dike-minio:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dike-mongo:
    name: dike-local-mongo
  dike-redis:
    name: dike-local-redis
  dike-minio:
    name: dike-local-minio
